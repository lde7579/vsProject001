[project]
name = "safety-stock"
version = "0.1.0"
description = "SKU별 적정 재고일수 산출·검증"
requires-python = ">=3.12"
dependencies = ["openpyxl"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_stock"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
